name: Build and Deploy

# Builds eudiplo.dev from this repository and an EUDIPLO checkout (schemas,
# CLI installer, SECURITY.md) and deploys it to the eudiplo-website Cloudflare
# Pages project.
#
# - push to main, schedule, eudiplo-production dispatch (EUDIPLO release or
#   deploy_site_only): production. The monthly run keeps the Expires field of
#   security.txt current.
# - eudiplo-preview dispatch (every push to EUDIPLO/eudiplo main): preview.
# - pull_request: build only.
#
# Schemas come from the EUDIPLO commit in the dispatch payload, else the head of
# EUDIPLO main; that commit must be on main. Schema versions are append-only and
# frozen once released, so main serves every released version, plus unreleased
# ones that may still change (see README). Production always takes the CLI
# installer and SECURITY.md from the latest EUDIPLO release, so an unreleased
# install.sh never reaches users who pipe it to bash.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 1 * *'
  repository_dispatch:
    types: [eudiplo-production, eudiplo-preview]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Cloudflare Pages branch: preview or production'
        required: true
        type: choice
        options: [preview, production]
        default: preview
      eudiplo_ref:
        description: 'EUDIPLO commit SHA or tag; empty = head of main'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || ((github.event.action == 'eudiplo-preview' || inputs.environment == 'preview') && 'preview' || 'production') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve environment and EUDIPLO ref
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.eudiplo_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request) environment=none; ref= ;;
            push|schedule) environment=production; ref= ;;
            repository_dispatch)
              case "$DISPATCH_TYPE" in
                eudiplo-production) environment=production ;;
                eudiplo-preview) environment=preview ;;
                *) echo "Unknown dispatch type '$DISPATCH_TYPE'"; exit 1 ;;
              esac
              ref="$DISPATCH_REF" ;;
            workflow_dispatch) environment="$INPUT_ENVIRONMENT"; ref="$INPUT_REF" ;;
            *) echo "Unsupported event '$EVENT'"; exit 1 ;;
          esac
          if [ -z "$ref" ]; then
            ref="$(gh api repos/EUDIPLO/eudiplo/commits/main --jq .sha)"
          fi
          [[ "$ref" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$ ]] || { echo "Invalid EUDIPLO ref '$ref' (expected a commit SHA or release tag)"; exit 1; }
          # Only reviewed code: the commit must be on main (fork or pull request
          # commits share object storage and would otherwise check out).
          status="$(gh api "repos/EUDIPLO/eudiplo/compare/${ref}...main" --jq .status)"
          case "$status" in
            identical|ahead) ;;
            *) echo "EUDIPLO $ref is not on main (compare status '$status')"; exit 1 ;;
          esac
          release="$(gh api repos/EUDIPLO/eudiplo/releases/latest --jq .tag_name)"
          [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected latest release '$release'"; exit 1; }
          if [ "$environment" = production ]; then installer_ref="$release"; else installer_ref="$ref"; fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "installer_ref=$installer_ref" >> "$GITHUB_OUTPUT"
          echo "Building $environment: schemas from EUDIPLO $ref, installer and SECURITY.md from $installer_ref"

      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout EUDIPLO
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EUDIPLO/eudiplo
          ref: ${{ steps.target.outputs.ref }}
          path: eudiplo
          persist-credentials: false
          sparse-checkout: |
            schemas
          sparse-checkout-cone-mode: false

      - name: Checkout EUDIPLO installer and security policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EUDIPLO/eudiplo
          ref: ${{ steps.target.outputs.installer_ref }}
          path: eudiplo-installer
          persist-credentials: false
          sparse-checkout: |
            apps/cli/install.sh
            apps/website/install.sh
            SECURITY.md
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build
        env:
          EUDIPLO_INSTALLER_DIR: eudiplo-installer
        run: npm run build

      - name: Check installer script
        run: |
          test -s dist/install.sh
          bash -n dist/install.sh

      - name: Deploy
        if: steps.target.outputs.environment != 'none'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_BRANCH: ${{ steps.target.outputs.environment }}
        run: |
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!var}" || { echo "$var is not configured"; exit 1; }
          done
          npx --yes wrangler@4.154.0 pages deploy dist --project-name eudiplo-website --branch "$CLOUDFLARE_PAGES_BRANCH" --commit-dirty=true
